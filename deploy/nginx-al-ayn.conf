# al-ayn.srv1956050.hstgr.cloud -> static frontend + Node API on 127.0.0.1:7860
# Installed by deploy/setup-server.sh (after the certificate exists).
#
# Frontend and API share one origin, so cookies stay SameSite=Strict and
# window.AL_AYN_API resolves to '' (same origin) in index.html.

server {
    listen 80;
    listen [::]:80;
    server_name al-ayn.srv1956050.hstgr.cloud;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name al-ayn.srv1956050.hstgr.cloud;

    ssl_certificate     /etc/letsencrypt/live/al-ayn.srv1956050.hstgr.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/al-ayn.srv1956050.hstgr.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The app has its own phone + PIN login; no server password in front of it.
    auth_basic off;

    root /opt/al-ayn/frontend;
    index index.html;

    # Announcement images are sent as data URLs inside JSON.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Note: nginx ignores server-level add_header lines inside a location that sets
    # its own, so each static location below repeats the security headers.
    # (The API sets its own via helmet.)

    # Backend API
    location /api/ {
        proxy_pass         http://127.0.0.1:7860;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Full exports/imports can be large.
        client_max_body_size 50m;
    }

    location = /health {
        proxy_pass http://127.0.0.1:7860/health;
    }

    # Versioned assets (?v=NN in index.html) can be cached.
    location ~* \.(js|css|svg|png|jpg|jpeg|webp|woff2|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # index.html and the manifest must always be revalidated so a deploy shows up
    # immediately (the ?v= numbers inside index.html then pull the new JS/CSS).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
