# Nginx config for AL-AYN on Hostinger VPS
# Place at: /etc/nginx/sites-available/al-ayn
# Enable: ln -s /etc/nginx/sites-available/al-ayn /etc/nginx/sites-enabled/al-ayn
# Test:   nginx -t
# Reload: systemctl reload nginx
#
# STAGE 1 (HTTP / IP — no domain yet):
#   Use this file as-is. 'server_name _;' matches any IP.
#
# STAGE 2 (HTTPS / domain):
#   1. Replace 'server_name _;' with 'server_name your-domain.com;'
#   2. Run: certbot --nginx -d your-domain.com
#   3. Set COOKIE_SECURE=true in .env and restart PM2
#   4. Uncomment the HSTS header below.

server {
  listen 80 default_server;
  server_name _;

  root /var/www/al-ayn/frontend;
  index index.html;

  client_max_body_size 1m;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Security headers
  add_header X-Content-Type-Options "nosniff"                always;
  add_header X-Frame-Options        "DENY"                   always;
  add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
  # Uncomment after enabling HTTPS:
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # SPA — all routes fall back to index.html
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "public, max-age=300";
  }

  # Static assets — long cache
  location ~* \.(js|css|svg|png|jpg|jpeg|webp|woff2|ico)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  # Backend API proxy
  location /api/ {
    proxy_pass         http://127.0.0.1:7860;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location = /health {
    proxy_pass http://127.0.0.1:7860/health;
  }
}
