  <!-- API base: empty = same origin (production). In local dev (frontend on a different
       port than the backend) point at the backend explicitly so POSTs don't hit the
       static file server. -->
  <script>
    (function () {
      var h = location.hostname;
      var p = location.port;
      // Covers localhost/127.0.0.1 plus private LAN IPs (192.168.x.x, 10.x.x.x,
      // 172.16-31.x.x) and mDNS ".local" hosts, so opening the site from a phone
      // on the same WiFi via the dev machine's LAN IP still finds the backend.
      var isLocal = h === 'localhost' || h.endsWith('.local') ||
        /^(127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(h);
      // Backend listens on 7860 (matches backend/server.js and the HF Space).
      // Use the SAME hostname the page is loaded from so cookies stay first-party —
      // 127.0.0.1 and localhost are different sites to the browser, and SameSite=Strict
      // cookies set by the backend on one are rejected when the page is on the other.
      window.WAMAN_API = (isLocal && p && p !== '7860') ? ('http://' + h + ':7860') : '';
      window.WAMAN_IS_LOCAL = isLocal;
    })();
  </script>

  <!-- ===== SCRIPTS ===== -->
  <script src="js/icons.js?v=29"></script>
  <script src="js/errors.js?v=29"></script>
  <script src="js/apiClient.js?v=29"></script>
  <script src="js/syncQueue.js?v=29"></script>
  <script src="js/data.js?v=29"></script>
  <script src="js/auth.js?v=29"></script>
  <script src="js/app.js?v=29"></script>

  <!-- ===== QA CAPTURE WIDGET (qapture) =====
       Dev/LAN-only: never loads on the deployed production origin.
       Bundled with esbuild (js/vendor/qapture-standalone.js, gitignored,
       rebuild with `npm run qa:build`) because the package's standalone
       entry point has bare `react`/`react-dom` imports a plain
       <script type="module"> cannot resolve without a bundler. -->
  <script type="module">
    if (window.WAMAN_IS_LOCAL) {
      Promise.all([
        import('./js/vendor/qapture-standalone.js'),
        import('./qa.config.js'),
      ]).then(([, { default: qaConfig }]) => {
        const el = document.createElement('qapture-widget');
        el.config = qaConfig;
        document.body.appendChild(el);
      }).catch((err) => console.warn('[qapture] failed to load QA widget:', err));
    }
  </script>
</body>
